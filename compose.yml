services:
  parse-dmarc:
    build:
      context: ./deploy/vibenest/wrapper
      dockerfile: Dockerfile
    expose:
    - "8080"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      DATABASE_PATH: /data/parse-dmarc.db
      MAILDIR_PATH: /data/maildir
      HTTP_AUTH_USER: "${HTTP_AUTH_USER:-pilot-owner}"
      HTTP_AUTH_PASSWORD: "${HTTP_AUTH_PASSWORD:?Set a unique HTTP_AUTH_PASSWORD of at least 24 characters}"
      VIBENEST_SYNTHETIC_FIXTURE: "true"
      FETCH_INTERVAL: "300"
      PARSE_DMARC_SERVE_ONLY: "false"
      PARSE_DMARC_METRICS: "true"
      GOMEMLIMIT: 180MiB
      GOMAXPROCS: "1"
    volumes:
    - report-data:/data
    deploy:
      resources:
        limits:
          memory: '268435456'
          cpus: 0.25
        reservations: {}
    mem_limit: 268435456
    memswap_limit: 268435456
    cpus: 0.25
volumes:
  report-data:
